services:
  - type: web
    name: teens-aloud-foundation
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/teens-aloud.db
      - key: SESSION_SECRET
        generateValue: true
      - key: DEFAULT_USER_PASSWORD
        sync: false
    disks:
      - name: teens-aloud-data
        mountPath: /var/data
        sizeGB: 1
